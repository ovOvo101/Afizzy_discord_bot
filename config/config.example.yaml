discord:
  guild_id: 0 # Optional: test server ID for instant slash-command sync.
  poll_channel_id: 0 # Set to 0 to disable scheduled polls.
  prompt_channel_id: 0 # Set to 0 to disable scheduled prompts.
features:
  invite_code_limit: true
  inspiration: false # Keeps daily polls, prompts, and /idea silent.
scheduling:
  timezone: Asia/Shanghai
  poll_time: "18:00"
  prompt_time: "20:00"
  poll_duration_hours: 24
storage:
  database_path: runtime/bot.sqlite3
content:
  polls_path: data/polls.yaml
  prompts_path: data/prompts.yaml
  ideas_path: data/ideas.yaml
