[project]
name = "creative-discord-bot"
version = "0.1.0"
description = "A low-pressure daily creativity bot for Discord communities."
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
