base:
  oc:
    - {id: base-oc-01, text: "Your OC meets their future self."}
    - {id: base-oc-02, text: "Your OC has to return something they borrowed years ago."}
    - {id: base-oc-03, text: "Your OC wakes up with a tiny, unexplained new ability."}
  fanart:
    - {id: base-fanart-01, text: "Draw a favorite character in a place they would never choose to visit."}
    - {id: base-fanart-02, text: "Illustrate a character after they have been caught doing something embarrassing."}
  fanfiction:
    - {id: base-fanfiction-01, text: "Write the first conversation after two characters have not spoken for years."}
    - {id: base-fanfiction-02, text: "Write a scene where a familiar place feels suddenly unfamiliar."}
  writing:
    - {id: base-writing-01, text: "Write about a letter that arrives at exactly the wrong time."}
    - {id: base-writing-02, text: "Write a scene where someone recognizes a voice before they recognize a face."}
  relationship:
    - {id: base-relationship-01, text: "Two characters have to share one room for one night."}
    - {id: base-relationship-02, text: "Your ship makes a bet neither of them expects to lose."}
  worldbuilding:
    - {id: base-worldbuilding-01, text: "Invent a rule everyone follows but nobody remembers learning."}
    - {id: base-worldbuilding-02, text: "Create a small business with a very strange specialty."}
  au:
    - {id: base-au-01, text: "Put your cast in a job they are hilariously unqualified for."}
    - {id: base-au-02, text: "Make an AU where magic is mostly used for boring chores."}
  funny:
    - {id: base-funny-01, text: "Your character tries to be mysterious and fails immediately."}
    - {id: base-funny-02, text: "A very serious plan is ruined by a very small animal."}
  challenge:
    - {id: base-challenge-01, text: "Create a scene around one object you can see right now."}
    - {id: base-challenge-02, text: "Make something using a color you do not usually choose."}
constraints:
  - {id: constraint-01, text: "It happens in a convenience store."}
  - {id: constraint-02, text: "It is raining outside."}
  - {id: constraint-03, text: "Nobody is allowed to explain what is going on."}
  - {id: constraint-04, text: "There is only ten minutes left."}
  - {id: constraint-05, text: "Someone is holding a drink they do not like."}
bonuses:
  - {id: bonus-01, text: "Neither of them recognizes the other."}
  - {id: bonus-02, text: "A stranger knows more than they should."}
  - {id: bonus-03, text: "The background is suspiciously cheerful."}
  - {id: bonus-04, text: "It ends with an unanswered question."}
  - {id: bonus-05, text: "A pet has the final word."}
